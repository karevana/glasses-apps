<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach">
<title>Stronger Humans</title>
<style>
  /* Phone page for the Stronger Humans meal coach. Plain facts, kind coach, no scolding. */
  :root { --bg:#101214; --card:#1a1d21; --line:#2a2f36; --text:#f2f4f5; --dim:#9aa6ad; --accent:#3df5c8; --warm:#ffb21e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin: 6px 2px 14px; }
  h1 { margin:0; font-size:22px; letter-spacing:.01em; }
  h1 span { color: var(--accent); }
  #today { color: var(--dim); font-size: 14px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 22px 2px 8px; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .snap { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height: 92px; border-radius: 14px;
    border: 1px solid var(--line); background: #22272d; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; text-align:center; }
  .btn.primary { background: #0f3d34; border-color: var(--accent); }
  .btn .ic { font-size: 28px; line-height: 1; }
  .btn:disabled { opacity: .5; }
  input[type=file] { display: none; }
  .row { display:flex; gap:8px; flex-wrap: wrap; margin-top: 12px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--accent); color: #062b24; border-color: var(--accent); font-weight: 700; }
  .field { width: 100%; margin-top: 10px; background: #0d0f11; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
  textarea.field { min-height: 70px; resize: vertical; }
  .status { margin-top: 12px; color: var(--dim); font-size: 15px; display:flex; align-items:center; gap:10px; }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #333; border-top-color: var(--accent); animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { color: #ff8b8b; }
  .result { margin-top: 14px; display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; }
  .result img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; }
  .desc { font-weight: 600; }
  .items { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .nums { display:flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .num { background: #0d0f11; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; color: var(--dim); }
  .num b { color: var(--text); }
  .coach { margin-top: 12px; border-left: 3px solid var(--warm); padding: 8px 12px; background: #221d12; border-radius: 0 10px 10px 0; }
  .coach .who { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--warm); font-weight: 700; }
  .coach .item { margin-top: 6px; font-size: 14px; color: var(--dim); }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .meal { padding: 12px 0; border-top: 1px solid var(--line); }
  .meal:first-of-type { border-top: 0; padding-top: 4px; }
  .meal .t { font-size: 13px; color: var(--dim); }
  .totals { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  .totals div { background:#0d0f11; border:1px solid var(--line); border-radius: 10px; padding: 8px 4px; }
  .totals b { display:block; font-size: 20px; }
  .totals span { font-size: 12px; color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; }
  td.none { color: #59636a; }
  .answer { margin-top: 12px; white-space: normal; }
  .answer ul { padding-left: 20px; margin: 6px 0; }
  .ask-btn { margin-top: 10px; width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--accent); background: #0f3d34; color: var(--text); font: inherit; font-weight: 700; }
  .foot { text-align:center; color:#5d686f; font-size: 12px; margin-top: 26px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<main>
  <header><h1>Stronger <span>Humans</span></h1><div id="today"></div></header>

  <div class="card hidden" id="keyCard">
    <b>Paste your Coach address once</b>
    <input class="field" id="keyIn" placeholder="https://karevana.github.io/glasses-apps/coach/?k=…">
  </div>

  <!-- SNAP -->
  <div class="card">
    <div class="snap">
      <button class="btn primary" id="bCam"><span class="ic">📷</span>Take photo</button>
      <button class="btn" id="bPick"><span class="ic">🖼️</span>Choose photo<br><small style="font-weight:400;color:var(--dim)">incl. from glasses</small></button>
    </div>
    <input type="file" id="fCam" accept="image/*" capture="environment">
    <input type="file" id="fPick" accept="image/*">
    <div class="row" id="meals"></div>
    <input class="field" id="note" placeholder="Optional note (e.g. half portion, oat milk)" maxlength="200">
    <div id="status"></div>
    <div id="result"></div>
  </div>

  <!-- TODAY -->
  <h2>Today</h2>
  <div class="card" id="todayCard"><div class="status"><div class="spin"></div>Loading…</div></div>

  <!-- WEEK -->
  <h2>This week</h2>
  <div class="card" id="weekCard"></div>

  <!-- ASK -->
  <h2>Ask the coach</h2>
  <div class="card">
    <textarea class="field" id="q" placeholder="e.g. What could I add at dinner? Am I getting enough protein this week?" style="margin-top:0"></textarea>
    <button class="ask-btn" id="bAsk">Ask</button>
    <div id="answer"></div>
  </div>

  <div class="foot">Numbers are estimates from photos, not measurements. Not medical advice.</div>
</main>

<script>
const API = 'https://n8n.rainandwind.ca/webhook/';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- private key (?k=) ---------- */
(() => { const k = new URLSearchParams(location.search).get('k'); if (k) store.set('coach.key', k); })();
const KEY = () => store.get('coach.key') || '';
if (!KEY()) $('keyCard').classList.remove('hidden');
$('keyIn').addEventListener('input', () => { const m = $('keyIn').value.match(/[?&]k=([^&#\s]+)/); if (m) { store.set('coach.key', m[1]); $('keyCard').classList.add('hidden'); loadSummary(); } });

/* ---------- local date/time ---------- */
const pad = n => String(n).padStart(2, '0');
const localDate = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localTime = (d = new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
$('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

/* ---------- meal chips (auto-picked by time of day) ---------- */
const MEALS = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
function guessMeal() { const h = new Date().getHours() + new Date().getMinutes() / 60; return h < 10.5 ? 'Breakfast' : h < 14.5 ? 'Lunch' : h < 16.5 ? 'Snack' : h < 21 ? 'Dinner' : 'Snack'; }
let meal = guessMeal();
function renderChips() { $('meals').innerHTML = MEALS.map(m => `<button class="chip ${m === meal ? 'on' : ''}" data-m="${m}">${m}</button>`).join('');
  $('meals').querySelectorAll('.chip').forEach(c => c.onclick = () => { meal = c.dataset.m; renderChips(); }); }
renderChips();

/* ---------- photo → resize → send ---------- */
$('bCam').onclick = () => $('fCam').click();
$('bPick').onclick = () => $('fPick').click();
$('fCam').onchange = e => handle(e.target.files[0], e.target);
$('fPick').onchange = e => handle(e.target.files[0], e.target);

function resize(file, max = 1280) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82)); };
    img.onerror = () => rej(new Error('That photo could not be opened.')); img.src = url;
  });
}
function busy(on) { $('bCam').disabled = $('bPick').disabled = on; }
async function handle(file, input) {
  if (!file) return;
  if (!KEY()) { $('keyCard').classList.remove('hidden'); $('keyIn').focus(); input.value = ''; return; }
  busy(true); $('result').innerHTML = '';
  $('status').innerHTML = `<div class="status"><div class="spin"></div>Looking at your plate… about 10–15 seconds</div>`;
  try {
    const dataUrl = await resize(file);
    const body = new URLSearchParams({ k: KEY(), image: dataUrl, mime: 'image/jpeg', meal, note: $('note').value.trim(), date: localDate(), time: localTime() });
    const r = await fetch(API + 'sh-meal', { method: 'POST', body });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
    $('status').innerHTML = ''; $('note').value = '';
    $('result').innerHTML = mealCard(d.meal, dataUrl);
    loadSummary();
  } catch (err) { $('status').innerHTML = `<div class="status err">${esc(err.message)}</div>`; }
  finally { busy(false); input.value = ''; }
}
function nums(m) {
  return `<div class="nums">
    <span class="num">Protein <b>${m.protein_g} g</b></span><span class="num">Fibre <b>${m.fibre_g} g</b></span>
    <span class="num">Fruit/veg <b>${m.fruit_veg_servings}</b></span><span class="num">Carbs <b>${m.carbs_g} g</b></span>
    <span class="num">Fat <b>${m.fat_g} g</b></span><span class="num">~<b>${m.calories}</b> kcal</span></div>`;
}
function coachBox(m) {
  if (!m.suggestion) return '';
  return `<div class="coach"><div class="who">Coach</div>${esc(m.suggestion)}${m.add_item ? `<div class="item">🛒 ${esc(m.add_item)}</div>` : ''}</div>`;
}
function mealCard(m, img) {
  return `<div class="result"><img src="${img}" alt=""><div><div class="desc">${esc(m.meal ? m.meal + ' · ' : '')}${esc(m.description)}</div>
    <div class="items">${esc(m.items)}</div></div></div>${nums(m)}${coachBox(m)}
    <div class="note">Confidence: ${esc(m.confidence || '?')}${m.notes ? ' · ' + esc(m.notes) : ''}</div>`;
}

/* ---------- today + week ---------- */
async function loadSummary() {
  if (!KEY()) { $('todayCard').innerHTML = '<div class="status">Add your Coach address above.</div>'; return; }
  try {
    const d = await fetch(`${API}sh-summary?k=${encodeURIComponent(KEY())}&date=${localDate()}`, { cache: 'no-store' }).then(r => r.json());
    if (!d.ok) throw new Error(d.error || 'Could not load today.');
    const t = d.today.totals;
    $('todayCard').innerHTML = `<div class="totals">
        <div><b>${t.protein_g}</b><span>protein g</span></div><div><b>${t.fibre_g}</b><span>fibre g</span></div>
        <div><b>${t.fruit_veg_servings}</b><span>fruit/veg</span></div><div><b>${d.today.meals.length}</b><span>meals</span></div></div>` +
      (d.today.meals.length ? d.today.meals.map(m => `<div class="meal"><div class="t">${esc(m.time)} · ${esc(m.meal || 'Meal')}</div>
        <div class="desc">${esc(m.description)}</div>${coachBox(m)}</div>`).join('') : '<div class="note" style="margin-top:12px">No meals logged yet today.</div>');
    $('weekCard').innerHTML = `<table><tr><th>Day</th><th>Meals</th><th>Protein</th><th>Fibre</th><th>Fruit/veg</th></tr>` +
      d.week.days.map(x => { const day = new Date(x.date + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short' });
        return x.meals ? `<tr><td>${day}</td><td>${x.meals}</td><td>${x.protein_g} g</td><td>${x.fibre_g} g</td><td>${x.fruit_veg_servings}</td></tr>`
                       : `<tr><td>${day}</td><td class="none" colspan="4">—</td></tr>`; }).join('') + `</table>`;
  } catch (err) { $('todayCard').innerHTML = `<div class="status err">${esc(err.message)}</div>`; }
}

/* ---------- ask ---------- */
function md(s) {   // tiny markdown: **bold**, - bullets, paragraphs
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').split('\n');
  let out = '', inList = false;
  for (const l of lines) {
    if (/^\s*[-•]\s+/.test(l)) { if (!inList) { out += '<ul>'; inList = true; } out += '<li>' + l.replace(/^\s*[-•]\s+/, '') + '</li>'; }
    else { if (inList) { out += '</ul>'; inList = false; } if (l.trim()) out += '<p style="margin:6px 0">' + l + '</p>'; }
  }
  return out + (inList ? '</ul>' : '');
}
$('bAsk').onclick = async () => {
  const q = $('q').value.trim(); if (!q) { $('q').focus(); return; }
  $('bAsk').disabled = true; $('answer').innerHTML = `<div class="status"><div class="spin"></div>Thinking…</div>`;
  try {
    const d = await fetch(API + 'sh-ask', { method: 'POST', body: new URLSearchParams({ k: KEY(), question: q, date: localDate() }) }).then(r => r.json());
    if (!d.ok) throw new Error(d.error || 'No answer came back.');
    $('answer').innerHTML = `<div class="answer">${md(d.answer)}</div>`;
  } catch (err) { $('answer').innerHTML = `<div class="status err">${esc(err.message)}</div>`; }
  finally { $('bAsk').disabled = false; }
};

loadSummary();
</script>
</body>
</html>
