<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Morning Brief on Meta Ray-Ban Display: today's local news, events, national news and stocks as clean swipe-through cards, or read aloud.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Morning Brief</title>
<style>
  /* Morning Brief for the glasses.
     Muse writes the brief to Google Sheets at 6 AM; n8n hands the newest one to this page.
     Additive display: black = see-through, so bright text on black. One story per card. */
  :root {
    --accent: #ffc44d;   /* morning gold */
    --text: #ffffff;
    --dim: #a9b7be;
    --up: #6ee7a8; --down: #ff9a8a;
    --focus: #ffd84a;
    --u: min(1vw, 1vh);  /* 600x600 => 6px */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: calc(var(--u) * 3.5); gap: calc(var(--u) * 2); }
  .screen.active { display: flex; }
  button { font: inherit; color: inherit; background: #111; border: calc(var(--u) * .5) solid #333; border-radius: calc(var(--u) * 2.5);
    cursor: pointer; padding: calc(var(--u) * 2.2) calc(var(--u) * 1.5); font-size: calc(var(--u) * 4.4); font-weight: 700; }
  button.go { background: #2b2108; border-color: var(--accent); }
  button:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 calc(var(--u) * .6) var(--focus); }
  .msg { color: var(--dim); font-size: calc(var(--u) * 4.4); line-height: 1.35; text-align: center; margin: auto 0; }
  .spin { width: calc(var(--u) * 8); height: calc(var(--u) * 8); margin: 0 auto calc(var(--u) * 3); border-radius: 50%;
    border: calc(var(--u) * 1) solid #222; border-top-color: var(--accent); animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* ---------- home ---------- */
  /* day switcher on Home: ◀ earlier brief · ▶ later brief */
  .dayrow { display: grid; grid-template-columns: calc(var(--u) * 12) 1fr calc(var(--u) * 12); gap: calc(var(--u) * 1.8); align-items: center; }
  .dayrow button { padding: calc(var(--u) * 1.4) 0; font-size: calc(var(--u) * 4.2); }
  .dayrow button:disabled { opacity: .25; }
  .dayrow .mid { text-align: center; }
  .past-note { color: var(--accent); font-size: calc(var(--u) * 3.6); }
  .kicker { color: var(--accent); font-size: calc(var(--u) * 3.8); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .day { font-size: calc(var(--u) * 8); font-weight: 800; line-height: 1.05; }
  .hello { color: var(--dim); font-size: calc(var(--u) * 4); line-height: 1.35; }
  .stale { color: var(--down); font-size: calc(var(--u) * 3.6); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.8); }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 1.6); margin-top: auto; }
  .sections button { text-align: left; font-size: calc(var(--u) * 4); padding: calc(var(--u) * 2) calc(var(--u) * 2.4); display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 1); }
  .sections button span { color: var(--dim); font-weight: 600; font-size: calc(var(--u) * 3.4); }

  /* ---------- card ---------- */
  .bar { display: flex; justify-content: space-between; align-items: baseline; }
  .sec { color: var(--accent); font-size: calc(var(--u) * 4); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .sec small { color: var(--dim); font-weight: 600; letter-spacing: 0; text-transform: none; margin-left: calc(var(--u) * 1.4); }
  .count { color: var(--dim); font-size: calc(var(--u) * 3.6); }
  .dots { display: flex; gap: calc(var(--u) * .8); }
  .dots i { flex: 1; height: calc(var(--u) * .7); background: #262626; border-radius: 99px; }
  .dots i.on { background: var(--accent); }
  #body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 2.2); }
  .head { font-weight: 800; line-height: 1.18; }
  .detail { color: var(--dim); line-height: 1.35; }
  .para { line-height: 1.4; }
  .list { display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); }
  .list div { display: flex; justify-content: space-between; gap: calc(var(--u) * 2); border-bottom: 1px solid #1f1f1f; padding-bottom: calc(var(--u) * .8); }
  .list b { font-weight: 800; }
  .list .dn { color: var(--down); } .list .up { color: var(--up); }
  .list b { flex: 0 0 auto; max-width: 58%; }
  .list span { color: var(--dim); text-align: right; }
  .top { margin-top: calc(var(--u) * 1); border-left: calc(var(--u) * .8) solid var(--accent); padding-left: calc(var(--u) * 2.4); }
  .top small { display: block; color: var(--accent); font-size: calc(var(--u) * 3.2); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .top div { font-size: calc(var(--u) * 4.6); font-weight: 700; line-height: 1.25; }
  .ctl { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: calc(var(--u) * 1.6); }

  /* ---------- daily picks ---------- */
  .pcat { color: var(--accent); font-size: calc(var(--u) * 4.2); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .react { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: calc(var(--u) * 1.6); }
  .react[hidden] { display: none; }
  .react button { font-size: calc(var(--u) * 4); padding: calc(var(--u) * 2) calc(var(--u) * 1); }
  .react button.watch { grid-column: 1 / -1; background: #2b2108; border-color: var(--accent); }
  .react.two { grid-template-columns: 1.4fr 1fr; }
  .react.two button.watch { grid-column: auto; }
  .saved { text-align: center; }
  .saved .tick { font-size: calc(var(--u) * 16); line-height: 1; color: var(--up); }
  .saved .what { font-size: calc(var(--u) * 6); font-weight: 800; margin-top: calc(var(--u) * 2); }
  .saved .sub { color: var(--dim); font-size: calc(var(--u) * 4); margin-top: calc(var(--u) * 1.5); }
  .saved.err .tick { color: var(--down); }
  #bRead.on { background: #2b2108; border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<section class="screen active" id="home">
  <div class="msg"><div class="spin"></div>Getting your brief…</div>
</section>

<section class="screen" id="card">
  <div class="bar"><div class="sec" id="secName"></div><div class="count" id="count"></div></div>
  <div class="dots" id="dots"></div>
  <div id="body"></div>
  <div class="react" id="react" hidden></div>
  <div class="ctl">
    <button id="bPrev">◀ Back</button>
    <button id="bRead">🔊 Read</button>
    <button class="go" id="bNext">Next ▶</button>
  </div>
</section>

<script>
const API = 'https://n8n.rainandwind.ca/webhook/glasses-brief';
const FEEDBACK_API = 'https://n8n.rainandwind.ca/webhook/glasses-brief-feedback';
const TUBE = '../tube/';
const MUSIC_API = 'https://n8n.rainandwind.ca/webhook/glasses-music-done';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
(() => { const k = new URLSearchParams(location.search).get('k'); if (k) store.set('brief.key', k); })();
const KEY = () => store.get('brief.key', '');
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
// Which brief is shown: '' = the newest (normal), or a YYYY-MM-DD picked with ◀ / ▶ on Home.
let viewDate = '';
const briefCache = {};   // day -> brief, so stepping back and forth is instant
const isPast = () => !!(viewDate && viewDate !== todayISO());
const shiftISO = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const dayName = s => s === todayISO() ? 'Today' : s === shiftISO(todayISO(), -1) ? 'Yesterday' : new Date(s + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long' });

/* =====================================================================
   Turn Muse's markdown brief into cards.
   "# title", greeting paragraph, "## Section — subtitle", "- **Headline** detail" bullets, paragraphs.
   ===================================================================== */
const plain = s => s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/\*(.+?)\*/g, '$1').trim();
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function parseBrief(md) {
  const out = { title: '', greeting: '', signoff: '', sections: [] };
  let sec = null;
  const lines = md.replace(/\r/g, '').split('\n');
  const paras = [];   // [{sec, text}] collected in order with bullets
  for (const raw of lines) {
    const l = raw.trim();
    if (!l) continue;
    if (/^#\s+/.test(l)) { out.title = l.replace(/^#\s+/, ''); continue; }
    if (/^##\s+/.test(l)) {
      const t = l.replace(/^##\s+/, '');
      const [name, ...rest] = t.split(/\s+[—–-]\s+/);
      sec = { name: name.trim(), sub: rest.join(' — ').trim(), items: [] };
      out.sections.push(sec); continue;
    }
    if (/run id/i.test(l)) continue;                                  // housekeeping line from the worker
    if (/^[-*•]\s+/.test(l)) {
      const t = l.replace(/^[-*•]\s+/, '');
      const m = t.match(/^\*\*(.+?)\*\*\s*(.*)$/);
      const item = m ? { kind: 'story', head: m[1].replace(/[.:]$/, ''), detail: m[2].replace(/^[—–\-:,.;]\s*/, '') }
                     : { kind: 'story', head: plain(t), detail: '' };
      if (sec) sec.items.push(item);
      continue;
    }
    if (!sec) { out.greeting += (out.greeting ? ' ' : '') + plain(l); continue; }
    if (/:$/.test(l) && l.length < 70) continue;                      // "Here's what's happening close to home:"
    sec.items.push({ kind: 'para', text: l });
  }
  // Sign-off: the brief's very last paragraph, when it is a goodbye line.
  const last = out.sections[out.sections.length - 1];
  if (last && last.items.length) {
    const end = last.items[last.items.length - 1];
    if (end.kind === 'para' && /that's the (morning|brief)|have a (good|great)|enjoy/i.test(end.text)) { out.signoff = plain(end.text); last.items.pop(); }
  }
  // Runs of short stories (like a list of stocks) become compact list cards of up to 6 rows.
  for (const s of out.sections) {
    const merged = []; let run = [];
    const flush = () => {
      if (run.length >= 4) for (let i = 0; i < run.length; i += 6) merged.push({ kind: 'list', rows: run.slice(i, i + 6) });
      else merged.push(...run);
      run = [];
    };
    for (const it of s.items) {
      if (it.kind === 'story' && (it.head + ' ' + it.detail).length <= 60) run.push(it);
      else { flush(); merged.push(it); }
    }
    flush();
    s.items = merged;
  }
  out.sections = out.sections.filter(s => s.items.length);
  return out;
}

/* ---------- Daily Picks: today's row from Muse Test Log > Daily Picks, shown after Body ---------- */
const PICKS = [['food', 'Food'], ['activity', 'Activity'], ['exercise', 'Exercise']];
const REACTIONS = [['Done', '✓ Done'], ['Skipped', '⏭ Skipped'], ['Loved it', '♥ Loved it']];
function addPicks(p, picks) {
  const items = [];
  if (picks && picks.date === (viewDate || todayISO())) {
    for (const [cat, label] of PICKS) {
      const text = String(picks[cat] || '').trim();
      if (text) items.push({ kind: 'pick', cat, label, text, forDate: picks.date });
    }
    const title = String(picks.video_title || '').trim(), link = String(picks.video_link || '').trim();
    if (title || link) items.push({ kind: 'video', title: title || "Today's video", link });
  }
  if (!items.length) items.push({ kind: 'para', text: isPast() ? 'No picks were saved for that day.' : "Today's picks are not ready yet." });
  const bi = p.sections.findIndex(s => /^body\b/i.test(s.name));
  p.sections.splice(bi >= 0 ? bi + 1 : 0, 0, { name: 'Daily Picks', sub: '', items });
}
// What was chosen per pick on this device, so revisiting a card shows it (the Feedback tab keeps every rating).
const ratedKey = it => `${it.forDate}|${it.cat}`;
const rated = store.get('brief.rated', {});
let saving = false;
async function ratePick(it, reaction) {
  if (saving) return;
  saving = true; stopReading();
  $('react').hidden = true;
  $('body').innerHTML = `<div class="saved"><div class="spin"></div><div class="sub">Saving…</div></div>`;
  let ok = false, msg = '';
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch(FEEDBACK_API, { method: 'POST', signal: ctrl.signal,
      body: new URLSearchParams({ k: KEY(), for_date: it.forDate, category: it.cat, pick: it.text, feedback: reaction }) });
    clearTimeout(t);
    const d = await res.json(); ok = !!d.ok; msg = d.error || '';
  } catch (e) { msg = e.name === 'AbortError' ? 'That took too long.' : 'No connection.'; }
  if (ok) { rated[ratedKey(it)] = reaction; store.set('brief.rated', rated); }
  $('body').innerHTML = ok
    ? `<div class="saved"><div class="tick">✓</div><div class="what">Saved</div><div class="sub">${esc(it.label)}: ${esc(reaction)}</div></div>`
    : `<div class="saved err"><div class="tick">!</div><div class="what">Not saved</div><div class="sub">${esc(msg || 'Try again.')}</div></div>`;
  setTimeout(() => { saving = false; if (ok && at < deck.length - 1) at++; renderCard(); $('bNext').focus(); }, ok ? 1200 : 2200);
  return ok;
}
// Video card: Enter opens the link in the Tube app, which plays it straight away.
const ytId = link => { const m = String(link || '').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(String(link || '')) ? link : ''); };
function openVideo(it) {
  stopReading();
  const id = ytId(it.link);
  if (id) location.href = `${TUBE}?v=${id}&title=${encodeURIComponent(it.title)}`;
  else if (/^https?:\/\//.test(it.link)) location.href = it.link;
}

/* ---------- Evening Music: newest Muse Test Log > Music Picks row (Sally adds one ~6 PM), shown after all other sections ---------- */
// Flexible nights, no streaks: each habit is an option, Done just logs it to Music Log.
const MUSIC_NOT_READY = "Tonight's music picks aren't ready yet — they arrive around 6 PM.";
function addMusic(p, m) {
  const items = [];
  if (m && m.week_of === (viewDate || todayISO()) && (m.is_today || isPast())) {
    if (m.guitar_song) items.push({ kind: 'music', act: 'guitar', label: 'Guitar', title: m.guitar_song,
      by: m.guitar_artist, note: m.why_it_fits, link: m.guitar_video,
      pick: m.guitar_song, date: m.week_of });   // pick = the cell text exactly, so Sally can match it
    if (m.sax_lesson) items.push({ kind: 'music', act: 'sax', label: 'Sax', title: m.sax_lesson, link: m.sax_video, pick: m.sax_lesson, date: m.week_of });
    if (m.cymatics_frequency) items.push({ kind: 'music', act: 'cymatics', label: 'Cymatics', title: m.cymatics_frequency, link: m.cymatics_video, pick: m.cymatics_frequency, date: m.week_of });
  }
  if (!items.length) items.push({ kind: 'para', text: isPast() ? 'No music picks for that day.' : MUSIC_NOT_READY });
  p.sections.push({ name: 'Evening Music', sub: '', items });
}
const doneKey = it => `${it.date}|${it.act}`;
const musicDone = store.get('brief.musicDone', {});
async function markMusicDone(it) {
  if (saving) return;
  saving = true; stopReading();
  $('react').hidden = true;
  $('body').innerHTML = `<div class="saved"><div class="spin"></div><div class="sub">Saving…</div></div>`;
  let ok = false, msg = '';
  try {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 10000);
    const res = await fetch(MUSIC_API, { method: 'POST', signal: ctrl.signal,
      body: new URLSearchParams({ k: KEY(), activity: it.act, pick: it.pick, video: it.link || '' }) });
    clearTimeout(t);
    const d = await res.json(); ok = !!d.ok; msg = d.error || '';
  } catch (e) { msg = e.name === 'AbortError' ? 'That took too long.' : 'No connection.'; }
  if (ok) { musicDone[doneKey(it)] = 1; store.set('brief.musicDone', musicDone); }
  $('body').innerHTML = ok
    ? `<div class="saved"><div class="tick">✓</div><div class="what">Saved</div><div class="sub">${esc(it.label)}: done</div></div>`
    : `<div class="saved err"><div class="tick">!</div><div class="what">Not saved</div><div class="sub">${esc(msg || 'Try again.')}</div></div>`;
  setTimeout(() => { saving = false; if (ok && at < deck.length - 1) at++; renderCard(); $('bNext').focus(); }, ok ? 1200 : 2200);
  return ok;
}

/* ---------- build the deck ---------- */
let brief = null, deck = [], at = 0;
function buildDeck() {
  deck = [];
  brief.parsed.sections.forEach((s, si) => s.items.forEach((it, ii) => deck.push({ si, ii, n: s.items.length, sec: s, it })));
  deck.push({ end: true });
}
function cardSpeech(c) {
  if (c.end) return brief.parsed.signoff || "That's the brief.";
  const it = c.it;
  const intro = c.ii === 0 ? c.sec.name + '. ' : '';
  if (it.kind === 'para') return intro + plain(it.text);
  if (it.kind === 'list') return intro + it.rows.map(r => `${r.head} ${r.detail}`).join('. ');
  if (it.kind === 'pick') return intro + it.label + '. ' + it.text;
  if (it.kind === 'video') return intro + 'Video. ' + it.title;
  if (it.kind === 'music') return intro + it.label + '. ' + it.title + (it.by ? ', by ' + it.by : '') + (it.note ? '. ' + it.note : '');
  return intro + it.head + '. ' + it.detail;
}
const spoken = s => s.replace(/\bC\$/g, 'Canadian $').replace(/—/g, ', ').replace(/\s+/g, ' ');

/* ---------- screens + Back ---------- */
function show(id, focusId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  if (focusId) setTimeout(() => { const el = $(focusId); el && el.focus(); }, 0);
}
window.addEventListener('popstate', () => { stopReading(); renderHome(); show('home', 'bStart'); });

function reload() { delete briefCache[viewDate || 'latest']; $('home').innerHTML = `<div class="msg"><div class="spin"></div>Getting today's brief…</div>`; load(); }
function renderHome() {
  if (!brief) return;
  const p = brief.parsed;
  const d = brief.date ? new Date(brief.date + 'T12:00:00') : null;
  const day = d ? d.toLocaleDateString(undefined, { weekday: 'long' }) : 'Morning brief';
  const dateLine = d ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
  const stale = !viewDate && brief.date && brief.date !== todayISO();
  const ds = brief.dates || [];
  const pos = ds.indexOf(brief.date);
  const prevDay = pos > 0 ? ds[pos - 1] : '';
  const nextDay = pos >= 0 && pos < ds.length - 1 ? ds[pos + 1] : '';
  $('home').innerHTML = `
    <div class="dayrow">
      <button id="bPrevBrief" aria-label="Earlier brief" ${prevDay && !brief.offline ? '' : 'disabled'}>◀</button>
      <div class="mid"><div class="kicker">Morning brief${dateLine ? ' · ' + esc(dateLine) : ''}</div><div class="day">${esc(day)}</div></div>
      <button id="bNextBrief" aria-label="Later brief" ${nextDay && !brief.offline ? '' : 'disabled'}>▶</button>
    </div>
    ${brief.offline ? `<div class="stale">Couldn't reach the brief (${esc(brief.why || 'no connection')}). Showing the saved copy.</div>` : stale ? `<div class="stale">Today's brief isn't in yet. This is the latest one.</div>`
      : viewDate && brief.date !== todayISO() ? `<div class="past-note">${esc(dayName(brief.date))}'s brief · ▶ to go forward</div>` : ''}
    <div class="hello">${esc(p.greeting).slice(0, 160)}</div>
    <div class="row2">
      <button class="go" id="bStart">Start ▶</button>
      <button id="bListen">🔊 Read to me</button>
    </div>
    ${stale || brief.offline ? `<button id="bRefresh">↻ Refresh</button>` : ''}
    ${p.sections[0] && p.sections[0].items.find(i => i.kind === 'story') ? `<div class="top"><small>Top story</small><div>${esc(p.sections[0].items.find(i => i.kind === 'story').head)}</div></div>` : ''}
    <div class="sections">${p.sections.map((s, i) => `<button data-s="${i}">${esc(s.name)}<span>${s.items.length}</span></button>`).join('')}</div>`;
  $('bStart').onclick = () => openAt(0);
  // ▶ onto the newest day goes back to the normal (newest) view, so today's live watch numbers and picks show.
  if (prevDay) $('bPrevBrief').onclick = () => openDay(prevDay, 'bPrevBrief');
  if (nextDay) $('bNextBrief').onclick = () => openDay(nextDay === ds[ds.length - 1] ? '' : nextDay, 'bNextBrief');
  if ($('bRefresh')) $('bRefresh').onclick = reload;
  $('bListen').onclick = () => { openAt(0); startReading(); };
  $('home').querySelectorAll('.sections button').forEach(b => b.onclick = () => openAt(deck.findIndex(c => c.si === +b.dataset.s)));
}
function openAt(i) {
  if (!document.getElementById('card').classList.contains('active')) history.pushState({ screen: 'card' }, '');
  at = Math.max(0, Math.min(deck.length - 1, i));
  renderCard();
  show('card', $('bWatch') ? 'bWatch' : 'bNext');   // video and music cards: Enter plays
}

/* ---------- one card ---------- */
function renderCard() {
  const c = deck[at];
  const body = $('body');
  const react = $('react');
  react.hidden = true; react.innerHTML = ''; react.className = 'react';
  if (c.end) {
    $('secName').innerHTML = 'Done';
    $('count').textContent = '';
    $('dots').innerHTML = '';
    body.innerHTML = `<div class="para" style="text-align:center">${esc(brief.parsed.signoff || "That's the brief.")}</div>`;
    $('bNext').textContent = 'Finish';
  } else {
    $('secName').innerHTML = esc(c.sec.name) + (c.sec.sub ? `<small>${esc(c.sec.sub)}</small>` : '');
    $('count').textContent = `${c.ii + 1} / ${c.n}`;
    $('dots').innerHTML = Array.from({ length: c.n }, (_, i) => `<i class="${i <= c.ii ? 'on' : ''}"></i>`).join('');
    const it = c.it;
    if (it.kind === 'para') body.innerHTML = `<div class="para">${inline(it.text)}</div>`;
    else if (it.kind === 'list') body.innerHTML = `<div class="list">${it.rows.map(r => {
        const dir = /\bdown\b/i.test(r.head) ? 'dn' : /\bup\b/i.test(r.head) ? 'up' : '';
        return `<div><b class="${dir}">${esc(r.head)}</b><span>${esc(r.detail)}</span></div>`; }).join('')}</div>`;
    else if (it.kind === 'pick') {
      const was = rated[ratedKey(it)];
      body.innerHTML = `<div class="pcat">${esc(it.label)}${was ? ` <small style="color:var(--dim);letter-spacing:0;text-transform:none">· rated ${esc(was)}</small>` : ''}</div><div class="head">${esc(it.text)}</div>`;
      react.innerHTML = REACTIONS.map(([v, label], i) => `<button id="r${i}" data-r="${esc(v)}">${label}</button>`).join('');
      react.hidden = false;
      react.querySelectorAll('button').forEach(b => b.onclick = () => ratePick(it, b.dataset.r));
    }
    else if (it.kind === 'video') {
      body.innerHTML = `<div class="pcat">Video</div><div class="head">${esc(it.title)}</div>${it.link ? '' : `<div class="detail">No link for this one today.</div>`}`;
      if (it.link) { react.innerHTML = `<button class="watch" id="bWatch">▶ Watch in Tube</button>`; react.hidden = false; $('bWatch').onclick = () => openVideo(it); }
    }
    else if (it.kind === 'music') {
      const done = musicDone[doneKey(it)];
      body.innerHTML = `<div class="pcat">${esc(it.label)}${done ? ` <small style="color:var(--up);letter-spacing:0;text-transform:none">· done tonight</small>` : ''}</div>`
        + `<div class="head">${esc(it.title)}</div>`
        + (it.by ? `<div class="detail">by ${esc(it.by)}</div>` : '')
        + (it.note ? `<div class="detail">${esc(it.note)}</div>` : '');
      // Done only on tonight's picks: Music Log stamps today's date, so an older day is look-and-play only.
      const canDone = it.date === todayISO();
      react.className = canDone && it.link ? 'react two' : 'react';
      react.innerHTML = (it.link ? `<button class="watch" id="bWatch">▶ Play</button>` : '') + (canDone ? `<button id="bDone">✓ Done</button>` : '');
      react.hidden = !react.innerHTML;
      if (it.link) $('bWatch').onclick = () => openVideo(it);
      if (canDone) $('bDone').onclick = () => markMusicDone(it);
    }
    else body.innerHTML = `<div class="head">${esc(it.head)}</div>${it.detail ? `<div class="detail">${inline(it.detail)}</div>` : ''}`;
    const nxt = deck[at + 1];
    $('bNext').textContent = nxt && !nxt.end && nxt.si !== c.si ? `${nxt.sec.name} ▶` : 'Next ▶';
  }
  $('bPrev').disabled = at === 0;
  fit();
  // Video card: Enter plays it. Otherwise keep focus on a visible button (rating buttons disappear between cards).
  setTimeout(() => {
    if (!$('card').classList.contains('active')) return;
    if ($('bWatch') && !reading) { $('bWatch').focus(); return; }
    const a = document.activeElement;
    if (!a || a === document.body || !a.isConnected || a.offsetParent === null || a.disabled) $('bNext').focus();
  }, 0);
}
// Shrink text until the card fits the display, so nothing needs scrolling.
function fit() {
  const body = $('body');
  const sizes = { head: [7, 4.6], detail: [4.8, 3.6], para: [5.2, 3.6], list: [4.6, 3.4] };
  const els = [...body.querySelectorAll('.head,.detail,.para,.list')];
  let step = 0;
  const apply = () => els.forEach(el => { const k = el.className.split(' ')[0]; const [hi, lo] = sizes[k]; el.style.fontSize = `calc(var(--u) * ${Math.max(lo, hi - step * 0.3)})`; });
  apply();
  while (body.scrollHeight > body.clientHeight + 2 && step < 14) { step++; apply(); }
}
$('bNext').onclick = () => { if (saving) return; if (deck[at].end) { history.back(); return; } stopReading(); at++; renderCard(); };

/* ---------- arrow keys move the yellow focus ring to the nearest button in that direction; Enter presses it ---------- */
document.addEventListener('keydown', e => {
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!dir) return;
  const scr = document.querySelector('.screen.active');
  const btns = scr ? [...scr.querySelectorAll('button')].filter(b => !b.disabled && b.offsetParent !== null) : [];
  if (!btns.length) return;
  e.preventDefault();
  const cur = btns.includes(document.activeElement) ? document.activeElement : null;
  if (!cur) { btns[btns.length - 1].focus(); return; }
  const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  // Prefer buttons inside a 45° cone in that direction (same row for left/right), nearest first.
  const cand = btns.filter(b => b !== cur).map(b => {
    const q = b.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
    const along = dx * dir[0] + dy * dir[1], perp = Math.abs(dx * dir[1] + dy * dir[0]);
    return { b, along, perp, score: along + 4 * perp };   // strongly prefer the same row / column
  }).filter(c => c.along > 1);
  const pool = cand.some(c => c.perp <= c.along) ? cand.filter(c => c.perp <= c.along) : cand;
  pool.sort((a, b) => a.score - b.score);
  if (pool[0]) pool[0].b.focus();
});
$('bPrev').onclick = () => { if (saving) return; if (at > 0) { stopReading(); at--; renderCard(); } };

/* ---------- read aloud (the glasses have one built-in voice) ---------- */
let reading = false;
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
if (!canSpeak) $('bRead').style.visibility = 'hidden';
function speakCard() {
  if (!reading) return;
  const u = new SpeechSynthesisUtterance(spoken(cardSpeech(deck[at])));
  u.lang = 'en-US'; u.rate = 1.0;
  u.onend = () => {
    if (!reading) return;
    if (deck[at].end) { stopReading(); return; }
    at++; renderCard(); setTimeout(speakCard, 350);
  };
  u.onerror = () => stopReading();
  speechSynthesis.speak(u);
}
function startReading() {
  if (!canSpeak) return;
  reading = true; $('bRead').classList.add('on'); $('bRead').textContent = '■ Stop';
  speechSynthesis.cancel(); setTimeout(speakCard, 150);
}
function stopReading() {
  if (!reading) return;
  reading = false; $('bRead').classList.remove('on'); $('bRead').textContent = '🔊 Read';
  try { speechSynthesis.cancel(); } catch (e) {}
}
$('bRead').onclick = () => reading ? stopReading() : startReading();
document.addEventListener('visibilitychange', () => { if (document.hidden) stopReading(); });

/* ---------- load ---------- */
// Step to another day's brief from Home. '' = newest.
async function openDay(day, focusId) {
  stopReading();
  viewDate = day;
  if (briefCache[day || 'latest']) { useBrief(briefCache[day || 'latest']); show('home', focusId); fixFocus(focusId); return; }
  $('home').innerHTML = `<div class="msg"><div class="spin"></div>Getting ${day ? esc(dayName(day).toLowerCase() === 'yesterday' ? "yesterday's" : dayName(day) + "'s") : "today's"} brief…</div>`;
  await load();
  fixFocus(focusId);
}
// Keep the yellow ring on ◀ / ▶ while stepping; if that end is now disabled, use the other arrow or Start.
function fixFocus(id) { setTimeout(() => { const b = $(id); if (b && !b.disabled) b.focus(); else { const o = $(id === 'bPrevBrief' ? 'bNextBrief' : 'bPrevBrief'); (o && !o.disabled ? o : $('bStart')).focus(); } }, 0); }
function useBrief(d) {
  brief = Object.assign({}, d);
  brief.parsed = parseBrief(brief.full_text || brief.news_summary || '');
  addPicks(brief.parsed, brief.picks);
  addMusic(brief.parsed, brief.music);
  buildDeck();
  renderHome();
}
async function load() {
  if (!KEY()) { $('home').innerHTML = `<div class="msg">This copy has no key.<br>Add the app on the glasses using the full address that ends in ?k=…</div>`; return; }
  // Fetch today's brief. The ?t= stamp stops the glasses' web view from handing back yesterday's cached answer.
  // One retry with a longer wait, because the first request of the morning can be slow.
  const get = async ms => {
    const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms);
    try {
      const r = await fetch(`${API}?k=${encodeURIComponent(KEY())}${viewDate ? '&date=' + viewDate : ''}&t=${Date.now()}`, { cache: 'no-store', signal: ctrl.signal });
      const d = await r.json().catch(() => ({ ok: false, error: `The server answered ${r.status}.` }));
      if (!d.ok) { const e = new Error(d.error || 'No brief came back.'); e.fatal = r.status === 403; throw e; }
      return d;
    } catch (e) { if (e.name === 'AbortError') throw new Error('The brief took too long to arrive.'); throw e; }
    finally { clearTimeout(t); }
  };
  try {
    let d;
    try { d = await get(12000); } catch (e) { if (e.fatal) throw e; d = await get(25000); }
    briefCache[viewDate || 'latest'] = d;
    if (!viewDate) store.set('brief.last', d);
    brief = d;
  } catch (e) {
    if (viewDate && !e.fatal) {   // an older day didn't load: say so and offer the way back
      $('home').innerHTML = `<div class="msg">Couldn't get that day's brief.<br>${esc(e.message)}</div><button class="go" id="bRetry" style="margin-top:calc(var(--u)*4)">◀ Back to the latest</button>`;
      $('bRetry').onclick = () => openDay('', 'bStart'); $('bRetry').focus(); return;
    }
    const saved = store.get('brief.last', null);
    if (!saved || e.fatal) { $('home').innerHTML = `<div class="msg">Couldn't get the brief.<br>${esc(e.message)}</div><button class="go" id="bRetry" style="margin-top:calc(var(--u)*4)">↻ Try again</button>`; $('bRetry').onclick = reload; $('bRetry').focus(); return; }
    brief = Object.assign({}, saved, { offline: true, why: e.message });
  }
  useBrief(brief); show('home', 'bStart');
}

/* ---------- voice tools for Meta AI (WebMCP) ---------- */
const reply = text => ({ content: [{ type: 'text', text }] });
const findSection = name => brief ? brief.parsed.sections.findIndex(s => s.name.toLowerCase().includes(String(name || '').toLowerCase().replace(/s$/, ''))) : -1;
const TOOLS = [
  { name: 'show_brief_day', description: "Show an earlier day's morning brief on the glasses, or go back to today's. Day: 'yesterday', 'today', a weekday name, or YYYY-MM-DD.",
    inputSchema: { type: 'object', properties: { day: { type: 'string' } }, required: ['day'] },
    execute: async ({ day }) => {
      const t = String(day || '').trim().toLowerCase(); const ds = (brief && brief.dates) || [];
      let want = t === '' || t === 'today' || t === 'latest' ? '' : t === 'yesterday' ? shiftISO(todayISO(), -1) : /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : '';
      if (!want && t && !['today', 'latest'].includes(t)) { const names = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday']; const i = names.findIndex(n => t.startsWith(n.slice(0, 3)));
        if (i >= 0) for (let k = 1; k <= 7; k++) { const d = shiftISO(todayISO(), -k); if (new Date(d + 'T12:00:00').getDay() === i) { want = d; break; } } }
      if (want && !ds.includes(want)) return reply('There is no brief saved for that day.');
      if (want && want === ds[ds.length - 1]) want = '';
      if (history.state && history.state.screen === 'card') history.back();
      await openDay(want, 'bStart');
      return reply(`Showing ${want ? dayName(want).toLowerCase() === 'yesterday' ? "yesterday's" : dayName(want) + "'s" : "the latest"} brief.`); } },
  { name: 'read_brief', description: 'Read the morning brief aloud on the glasses, card by card. Optional section: local news, events, national news or stocks.',
    inputSchema: { type: 'object', properties: { section: { type: 'string', description: 'Section to start from, e.g. "stocks"' } } },
    execute: async ({ section } = {}) => { if (!brief) return reply('The brief has not loaded yet.'); const si = section ? findSection(section) : 0;
      openAt(si > 0 ? deck.findIndex(c => c.si === si) : 0); startReading(); return reply('Reading the brief.'); } },
  { name: 'show_section', description: 'Show one section of the morning brief: local news, events, national news or stocks.',
    inputSchema: { type: 'object', properties: { section: { type: 'string' } }, required: ['section'] },
    execute: async ({ section }) => { const si = findSection(section); if (si < 0) return reply('That section is not in today\'s brief.'); openAt(deck.findIndex(c => c.si === si)); return reply(`Showing ${brief.parsed.sections[si].name}.`); } },
  { name: 'next_story', description: 'Go to the next card of the morning brief.', inputSchema: { type: 'object', properties: {} },
    execute: async () => { if (!brief) return reply('Not loaded.'); stopReading(); openAt(at + 1); return reply('Next.'); } },
  { name: 'music_done', description: "Mark one of tonight's Evening Music picks (guitar, sax or cymatics) as done. Logs it to the Music Log tab.",
    inputSchema: { type: 'object', properties: { activity: { type: 'string', enum: ['guitar', 'sax', 'cymatics'] } }, required: ['activity'] },
    execute: async ({ activity }) => {
      const i = deck.findIndex(c => c.it && c.it.kind === 'music' && c.it.act === String(activity).toLowerCase());
      if (i < 0) return reply(MUSIC_NOT_READY);
      openAt(i); const ok = await markMusicDone(deck[i].it);
      return reply(ok ? `Saved: ${deck[i].it.label} done.` : 'That did not save. Try again.'); } },
  { name: 'rate_pick', description: "Rate one of today's Daily Picks (food, activity or exercise) as Done, Skipped or Loved it. Saves it to the Feedback tab.",
    inputSchema: { type: 'object', properties: { category: { type: 'string', enum: ['food', 'activity', 'exercise'] }, reaction: { type: 'string', enum: ['Done', 'Skipped', 'Loved it'] } }, required: ['category', 'reaction'] },
    execute: async ({ category, reaction }) => {
      const i = deck.findIndex(c => c.it && c.it.kind === 'pick' && c.it.cat === String(category).toLowerCase());
      if (i < 0) return reply("Today's picks are not ready yet.");
      openAt(i); const ok = await ratePick(deck[i].it, reaction);
      return reply(ok ? `Saved: ${deck[i].it.label} ${reaction}.` : 'That did not save. Try again.'); } },
  { name: 'stop_reading', description: 'Stop reading the brief aloud.', inputSchema: { type: 'object', properties: {} },
    execute: async () => { stopReading(); return reply('Stopped.'); } },
  { name: 'get_brief_summary', description: 'Get the short spoken summary of today\'s morning brief (news and stocks) to answer questions about it.', inputSchema: { type: 'object', properties: {} },
    execute: async () => brief ? reply(`Brief for ${brief.date}. ${brief.news_summary} ${brief.stocks_summary}`) : reply('Not loaded.') }
];
(function registerVoiceTools() {
  const mc = document.modelContext || navigator.modelContext;
  if (!mc || typeof mc.registerTool !== 'function') return;
  for (const t of TOOLS) { try { const p = mc.registerTool(t); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
})();

history.replaceState({ screen: 'home' }, '');
load();
</script>
</body>
