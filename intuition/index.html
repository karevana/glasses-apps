<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Musical Intuition: daily ear-first music practice for guitar and tenor sax on Meta Ray-Ban Display.">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Musical Intuition</title>
<style>
  /* Musical Intuition on the glasses.
     Additive display: black = see-through. 600x600. D-pad / arrow keys move a yellow focus ring, pinch = Enter.
     Everything runs in this page: lessons (lessons.js), music theory, Web Audio sound, progress in localStorage.
     No server, no keys, works offline after the first visit (sw.js). Web apps can't use the microphone,
     so the learner marks how each exercise went; pitch feedback is planned via a phone companion. */
  :root {
    --accent: #3df5c8; --text: #fff; --dim: #a9b2b8; --focus: #ffd84a;
    --listen: #7fc8ff; --sing: #ff9ad5; --imagine: #c7a6ff; --play: #3df5c8; --create: #ffb46b;
    --u: min(1vw, 1vh);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: calc(var(--u) * 3.5); gap: calc(var(--u) * 1.8); }
  .screen.active { display: flex; }
  button { font: inherit; color: inherit; background: #111; border: calc(var(--u) * .5) solid #333; border-radius: calc(var(--u) * 2.5); cursor: pointer;
    padding: calc(var(--u) * 2) calc(var(--u) * 1.2); font-size: calc(var(--u) * 4.3); font-weight: 700; }
  button.go { background: #062b24; border-color: var(--accent); }
  button.sel { border-color: var(--accent); color: var(--accent); }
  button:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 calc(var(--u) * .6) var(--focus); }
  .hidden { display: none !important; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 1.6); }
  .row2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: calc(var(--u) * 1.6); }
  .row3w { display: grid; grid-template-columns: 1.7fr 1fr 1fr; gap: calc(var(--u) * 1.6); }
  .brand { font-size: calc(var(--u) * 6); font-weight: 800; margin: 0; }
  .brand span { color: var(--accent); }
  .motto { color: var(--dim); font-size: calc(var(--u) * 3.4); }
  .card { border: calc(var(--u) * .4) solid #2a2a2a; border-radius: calc(var(--u) * 2.5); padding: calc(var(--u) * 2.4); }
  .card .k { color: var(--accent); font-size: calc(var(--u) * 3.6); font-weight: 800; letter-spacing: .05em; }
  .card .t { font-size: calc(var(--u) * 6); font-weight: 800; margin: calc(var(--u) * .6) 0; }
  .card .o { color: var(--dim); font-size: calc(var(--u) * 3.9); line-height: 1.3; }
  .msg { color: var(--dim); font-size: calc(var(--u) * 4.2); text-align: center; line-height: 1.4; }
  .spacer { flex: 1; }

  /* lesson */
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: calc(var(--u) * 2); }
  .ltitle { font-size: calc(var(--u) * 4); color: var(--dim); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lstep { font-size: calc(var(--u) * 3.8); color: var(--dim); white-space: nowrap; }
  .prow { display: flex; align-items: center; gap: calc(var(--u) * 2); }
  .phase { font-size: calc(var(--u) * 4.4); font-weight: 900; letter-spacing: .1em; padding: calc(var(--u) * .4) calc(var(--u) * 2);
    border: calc(var(--u) * .45) solid currentColor; border-radius: 999px; }
  .ph-LISTEN { color: var(--listen); } .ph-SING { color: var(--sing); } .ph-IMAGINE { color: var(--imagine); }
  .ph-PLAY { color: var(--play); } .ph-CREATE { color: var(--create); } .ph-REST, .ph-CHECK, .ph-REFLECT, .ph-WARMUP, .ph-PAUSED { color: #fff; }
  .inst { font-size: calc(var(--u) * 4); font-weight: 700; }
  .clock { margin-left: auto; font-size: calc(var(--u) * 5); font-weight: 800; font-variant-numeric: tabular-nums; }
  .bar { height: calc(var(--u) * 1.2); background: #222; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: calc(var(--u) * 2); }
  .seq { display: flex; gap: calc(var(--u) * 3); justify-content: center; align-items: flex-end; }
  .deg { display: flex; flex-direction: column; align-items: center; }
  .seq.playing .deg { opacity: .45; }
  .deg.on, .seq.single .deg { opacity: 1; }
  .deg.on b { color: var(--focus); }
  .deg b .oc { font-style: normal; font-size: .38em; vertical-align: middle; color: var(--dim); }
  /* chord display: current chord big, next chord to the right (yellow on the last beat before it changes) */
  .chordbox { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 3); }
  .chordbox .cc { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .chordbox .cc b { font-size: calc(var(--u) * 12); font-weight: 900; color: var(--create); }
  .chordbox .cc small { font-size: calc(var(--u) * 4); color: var(--dim); font-weight: 700; margin-top: calc(var(--u) * .6); }
  .chordbox .cc.on b { color: var(--focus); }
  .chordbox .row .cc b { font-size: calc(var(--u) * 9); }
  .chordbox .row { display: flex; gap: calc(var(--u) * 3.5); }
  .chordbox .nx { font-size: calc(var(--u) * 6.5); color: var(--dim); font-weight: 800; }
  .chordbox .nx.soon { color: var(--focus); }
  .chordbox em { font-style: normal; font-size: calc(var(--u) * 3.4); color: var(--dim); }
  .stage.compact .chordbox .cc b { font-size: calc(var(--u) * 8.5); }
  .stage.compact .chordbox .row .cc b { font-size: calc(var(--u) * 7); }
  .seq.lots { flex-wrap: nowrap; gap: calc(var(--u) * 1.6); }
  .seq.lots .deg b { font-size: calc(var(--u) * 7); }
  .seq.lots .deg small { font-size: calc(var(--u) * 3.3); }
  .deg.rest b { color: #555; }
  .seq.lots .deg.rest b { font-size: calc(var(--u) * 4.5); }
  .stage.compact .seq.lots .deg b { font-size: calc(var(--u) * 6.2); }
  .stage.compact .seq.lots .deg small { font-size: calc(var(--u) * 3); }
  .stage.compact .chordbox .cc b { font-size: calc(var(--u) * 7.5) !important; }
  .report { font-size: calc(var(--u) * 3.6); line-height: 1.35; color: var(--dim); overflow-y: auto; scrollbar-width: none; max-height: 100%; width: 100%; }
  .report b { color: var(--text); }
  /* interactive landscape */
  .land { display: grid; grid-template-columns: repeat(8, 1fr); gap: calc(var(--u) * 1); width: 100%; }
  .land .lc { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: calc(var(--u) * 1.6);
    background: #141414; border: calc(var(--u) * .45) solid #262626; padding: calc(var(--u) * 1.4) 0; transition: background .08s; }
  .land .lc b { font-size: calc(var(--u) * 8); font-weight: 900; line-height: 1; }
  .land .lc small { font-size: calc(var(--u) * 3.4); color: var(--dim); font-weight: 700; margin-top: calc(var(--u) * .6); white-space: nowrap; }
  .land .lc.home { border-color: var(--accent); }
  .land .lc.home b { color: var(--accent); }
  .land .lc.off { opacity: .32; }
  .land .lc.lit { background: var(--focus); border-color: var(--focus); opacity: 1; }
  .land .lc.lit b, .land .lc.lit small { color: #000; }
  .land .lc.rev { border-color: var(--listen); box-shadow: 0 0 0 calc(var(--u) * .4) var(--listen); opacity: 1; }
  .stage.compact .land .lc b { font-size: calc(var(--u) * 6.5); }
  .stage.compact .land .lc { padding: calc(var(--u) * .9) 0; }
  .scroll button.locked { opacity: .45; }
  .wk { color: var(--accent); font-size: calc(var(--u) * 3.6); font-weight: 800; letter-spacing: .05em; margin-top: calc(var(--u) * 1.2); }
  .deg b { font-size: calc(var(--u) * 14); line-height: 1; font-weight: 900; }
  .seq.single .deg b { font-size: calc(var(--u) * 20); }
  .stage { overflow: hidden; }
  .stage.compact .seq.single .deg b, .stage.compact .deg b { font-size: calc(var(--u) * 11); }
  .stage.compact .deg small, .stage.compact .seq.single .deg small { font-size: calc(var(--u) * 4.6); }
  .stage.compact { gap: calc(var(--u) * 1.2); }
  .seq.many .deg b { font-size: calc(var(--u) * 10); }
  .deg small { font-size: calc(var(--u) * 5.2); font-weight: 700; color: var(--dim); white-space: nowrap; }
  .seq.single .deg small { font-size: calc(var(--u) * 7); }
  .fing { font-size: calc(var(--u) * 3.7); line-height: 1.35; color: #fff; text-align: center; border: calc(var(--u) * .35) dashed #444;
    border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 1) calc(var(--u) * 2); }
  .rhythm { position: relative; width: 100%; height: calc(var(--u) * 7); }
  .rhythm .n { position: absolute; top: calc(var(--u) * 1.5); height: calc(var(--u) * 4); background: var(--accent); border-radius: calc(var(--u) * 1); }
  .rhythm .r { position: absolute; top: calc(var(--u) * 1.5); height: calc(var(--u) * 4); border: calc(var(--u) * .35) dashed #555; border-radius: calc(var(--u) * 1); }
  .rhythm .ph { position: absolute; top: 0; bottom: 0; width: calc(var(--u) * .7); background: var(--focus); }
  .instr { font-size: calc(var(--u) * 5.2); font-weight: 600; line-height: 1.25; text-align: center; min-height: 2.5em; display: flex; align-items: center; justify-content: center; }
  .beats { display: flex; justify-content: center; gap: calc(var(--u) * 2); height: calc(var(--u) * 2.4); }
  .beats i { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); border-radius: 50%; background: #333; }
  .beats i.on { background: var(--focus); }
  #ctxRow button { background: #0d1d2b; border-color: var(--listen); }

  /* quick reference guide */
  #guide { gap: calc(var(--u) * 1.4); }
  #gBody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: calc(var(--u) * 1.4); }
  .gtop { color: var(--accent); font-size: calc(var(--u) * 3.2); font-weight: 800; letter-spacing: .06em; }
  .gtitle { font-size: calc(var(--u) * 6.2); font-weight: 900; line-height: 1.1; }
  .gsub { color: var(--dim); font-size: calc(var(--u) * 3.6); }
  .gtab { display: grid; gap: calc(var(--u) * .9); margin-top: calc(var(--u) * 1); }
  .gtab .gl { font-size: calc(var(--u) * 3.4); font-weight: 800; color: var(--dim); display: flex; align-items: center; line-height: 1.1; }
  .gtab .gc { background: #121a18; border-radius: calc(var(--u) * 1.4); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: calc(var(--u) * 1.4) calc(var(--u) * .4); font-weight: 700; line-height: 1.1; }
  .gtab.gwide .gc { font-size: calc(var(--u) * 4.3); } .gtab.gmid .gc { font-size: calc(var(--u) * 4.8); } .gtab.gfew .gc { font-size: calc(var(--u) * 5); }
  .gtab .gc.hd { background: #1b1b1b; color: #fff; font-weight: 900; }
  .gtab .gc.home { background: #0f4a3d; color: var(--accent); }
  .gtab .gc.blue { color: var(--listen); }
  .gtab .gc.sm { font-size: calc(var(--u) * 3.5) !important; }
  .gtab .gc.dm { color: #cfd6da; background: #0d0d0d; }
  .gtab .gc small { font-size: .62em; color: var(--dim); margin-top: calc(var(--u) * .5); }
  .gtip { margin-top: auto; border-left: calc(var(--u) * .9) solid #f2c76b; padding: calc(var(--u) * 1.2) calc(var(--u) * 2); color: #f7e2b4;
    font-size: calc(var(--u) * 3.7); line-height: 1.3; background: #1a1408; border-radius: 0 calc(var(--u) * 1.4) calc(var(--u) * 1.4) 0; }
  /* lessons list */
  .scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: calc(var(--u) * 1.6); }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll button { text-align: left; }
  .scroll button small { display: block; color: var(--dim); font-weight: 600; font-size: calc(var(--u) * 3.4); }
  .stats { color: var(--dim); font-size: calc(var(--u) * 3.6); line-height: 1.35; }
  .stats b { color: var(--text); }
  .big { font-size: calc(var(--u) * 7); font-weight: 900; text-align: center; }
</style>

<body>

<!-- HOME -->
<section id="home" class="screen active">

  </div>
  <div class="card">

  </div>
  <div class="row3">

<script src="lessons.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LESSONS = window.LESSONS || [];

/* ======================================================================
   Learner profile (localStorage only — nothing leaves the glasses)
   ====================================================================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const DEFAULT_PROFILE = { v: 1, current: 'W01D01', instrument: 'guitar', minutes: 30, key: '', soundHigh: false, cues: false,
  done: {}, history: [], ear: {}, chords: {}, reflections: [], prefs: {}, song: null, review: [] };
let P = Object.assign({}, DEFAULT_PROFILE, store.get('intuition.profile', {}));
P.chords = P.chords || {}; P.prefs = P.prefs || {}; P.review = P.review || []; P.find = P.find || {};
const saveP = () => store.set('intuition.profile', P);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const lessonById = id => String(id).startsWith('LP') ? practiceLesson(+String(id).slice(2)) : (LESSONS.find(l => l.lesson_id === id) || LESSONS[0]);
const nextLessonOf = l => LESSONS[LESSONS.indexOf(l) + 1] || null;

/* ======================================================================
   Music theory: scale degrees -> notes, with B-flat tenor sax transposition
   Guitar shows concert names. Tenor sax shows written names: written = concert + major 9th
   (pitch class +2). Notes are spelled by letter so D major shows F♯ and C♯, not G♭ and D♭.
   ====================================================================== */
const MAJOR = [0, 2, 4, 5, 7, 9, 11], NAT_MINOR = [0, 2, 3, 5, 7, 8, 10];
const LETTERS = 'CDEFGAB', LETTER_PC = [0, 2, 4, 5, 7, 9, 11];
const PCS = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
const KEY_LIST = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const SAX_KEY = { C: 'D', Db: 'Eb', D: 'E', Eb: 'F', E: 'F#', F: 'G', 'F#': 'G#', G: 'A', Ab: 'Bb', A: 'B', Bb: 'C', B: 'C#' };
const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
const pretty = k => k[0] + k.slice(1).replace('#', '♯').replace('b', '♭');

let L = null;   // the lesson in progress (see startLesson)
const curLesson = () => L ? L.lesson : (LESSONS.find(l => l.lesson_id === P.current) || LESSONS[0]);
// Key: your Home choice, else this exercise's key (Day 44 moves a tune to G and F), else the lesson's; 'song' = the key you chose for your song
const resolveKey = k => k === 'song' ? ((P.song && P.song.key) || 'C') : k;
const concertKey = () => resolveKey(P.key || (L && L.ex && L.ex.key) || curLesson().concert_key || 'C');
const keyFor = inst => inst === 'sax' ? SAX_KEY[concertKey()] : concertKey();
const isMinorish = () => /minor|blues/.test(curLesson().scale || '') || (curLesson().scale === 'song' && !!(P.song && P.song.minor));
const keyLabel = () => `${pretty(concertKey())}${/blues/.test(curLesson().scale || '') ? ' blues' : isMinorish() ? ' minor' : ''}`;

/* Degrees are always counted against the MAJOR scale of home, so one system covers every lesson:
   a number (1–7; 0 = 7 below home; 8 = home an octave up; 9 = 2 above, …) or a string with an accidental:
   'b3', 'b6', 'b7' (minor), 'b5' (blue note), '#4'. Minor keys are written 1 2 ♭3 4 5 ♭6 ♭7. */
function parseDeg(d) {
  if (typeof d === 'number') return { n: d, a: 0 };
  const m = String(d).match(/^([b#♭♯]*)(-?\d+)$/); if (!m) return { n: 1, a: 0 };
  return { n: +m[2], a: [...m[1]].reduce((s, c) => s + (c === 'b' || c === '♭' ? -1 : 1), 0) };
}
const degNum = d => parseDeg(d).n;
const degSemis = d => { const { n, a } = parseDeg(d), i = n - 1; return MAJOR[((i % 7) + 7) % 7] + 12 * Math.floor(i / 7) + a; };
// Spell a note by letter: `steps` letters above the key's letter, `semis` semitones above the key's tonic.
function spellAt(key, steps, semis) {
  const li = ((LETTERS.indexOf(key[0]) + steps) % 7 + 7) % 7, target = ((PCS[key] + semis) % 12 + 12) % 12;
  return LETTERS[li] + ACC[(((target - LETTER_PC[li]) % 12) + 18) % 12 - 6];
}
function spell(key, d) { const { n, a } = parseDeg(d), i = ((n - 1) % 7 + 7) % 7; return spellAt(key, i, MAJOR[i] + a); }

      let tt = t + 0.1;

      tt = playLit(r, cur.degs, tt, { step: cur.step || ex.step });
      nextAt = tt + (ex.pause || 1.8);
    }
    const inst = instFor(ex, 0, 1);
    r.ui = { phase: cur.phase || 'LISTEN', inst, text: fill(cur.text || 'Watch and listen. Sing along if you like.', inst), degs: null,
      land: landUI(r, t, { pool: ex.pool }), remain: Math.max(0, dur - el), total: dur };
    return false;
  };
  r.action = a => { if (a === 'repeat') r.begin(); };
  return r;
}

/* 2 · Recognise musical relationships (shared with the course's "which number?" rounds).
   INTRO → HOME (per setting) → TARGET (hidden) → RESPONSE WINDOW (timer; ↻ Hear again restarts it)
   → REVEAL + REPLAY → you mark what went well (👂 heard it / 🎸 found it — both optional) → NEXT TRIAL.
   The answer is never shown before the reveal: 👁 Show and "give me a hint" cannot reveal it. */
function RecogRunner(ex) {
  const r = { ui: {}, lights: [] }, allowed = ex.allowed_degrees || [1, 5];
  const blocks = ex.blocks || [{ length: ex.phrase_length || 1, trials: ex.trials || 10 }];
  const queue = []; blocks.forEach(b => { for (let k = 0; k < scaleN(b.trials); k++) queue.push(b.length); });
  let i = 0, stage = 'play', ph = [1], prev = '', heard = false, found = false, hinted = false;
  const homeMode = () => ex.home || pref('homeRef'), wait = () => ex.wait || pref('wait');
  function gen(n) {
    let p, tries = 0;
    do { p = Array.from({ length: n }, () => allowed[Math.floor(Math.random() * allowed.length)]); tries++; } while (p.join() === prev && tries < 12);
    prev = p.join(); return p;
  }
  function play(withHome) {
    newBus(); r.lights = []; let t = now() + 0.15;
    if (withHome) t = playLit(r, [1], t, { tag: 'home' }) + 0.6;
    r.pe = playLit(r, ph, t, { tag: 'target' }); stage = 'play'; r.deadline = null;
  }
  function trial(first) { ph = gen(queue[i]); heard = found = hinted = false; const m = homeMode(); play(m === 'every' || (m === 'exercise' && first)); }
  function reveal() { stage = 'shown'; r.lights = []; playLit(r, ph, now() + 0.25, { tag: 'answer' }); }
  r.begin = () => { backingStop(); droneOn(0.14); i = 0; trial(true); };
  r.update = t => {
    if (stage === 'play' && t >= r.pe + 0.15) { stage = 'answer'; const w = wait(); r.deadline = typeof w === 'number' ? t + w : null; r.wlen = w; }
    if (stage === 'answer' && r.deadline && t >= r.deadline) reveal();
    const inst = instFor(ex, 0, 1), iname = inst === 'sax' ? 'sax' : inst === 'guitar' ? 'guitar' : 'instrument';
    let phase = 'LISTEN', text = 'Listen… which number?', ctx = null;
    if (stage === 'answer') {
      phase = 'SING'; text = `Which number? Sing it, then find it on your ${iname}.`;
      if (hinted) text += ` (one of ${allowed.map(degText).join(' · ')})`;
      ctx = [['hear', '↻ Hear again']];
      if (homeMode() !== 'every') ctx.push(['home', '🏠 Home']);
      if (!r.deadline) ctx.push(['reveal', '👁 Reveal']);
    }
    if (stage === 'shown') {
      phase = 'CHECK'; text = `It was ${ph.map(degText).join(' ')}. Compare. Mark what went well, then Next.`;
      ctx = [['heard', `👂 Heard it${heard ? ' ✓' : ''}`], ['found', `${inst === 'sax' ? '🎷' : '🎸'} Found it${found ? ' ✓' : ''}`], ['next', 'Next ▶']];
    }
    r.ui = { phase, inst, text, degs: stage === 'shown' ? ph : null, hidden: stage !== 'shown', lock: true, revealed: stage === 'shown', ctx,
      land: landFits(allowed) ? landUI(r, t, { pool: allowed, hideTarget: stage !== 'shown', reveal: stage === 'shown' ? ph : [] }) : null,
      remain: stage === 'answer' && r.deadline ? r.deadline - t : null, total: r.wlen, item: `${i + 1} of ${queue.length}` };
    if (!r.ui.land && stage !== 'shown') r.ui.degs = ph;    // degrees outside the landscape (e.g. ♭5): the old "?" boxes
    return false;
  };
  function record() {
    ph.forEach(d => {
      const e = P.ear[d] || [0, 0]; e[1]++; if (heard) e[0]++; P.ear[d] = e;
      const f = P.find[d] || [0, 0]; f[1]++; if (found) f[0]++; P.find[d] = f;
    });
    saveP();
  }
  r.action = a => {
    if (a === 'hear' || a === 'replay' || a === 'repeat') { if (stage !== 'shown') play(homeMode() === 'every'); else { r.lights = []; playLit(r, ph, now() + 0.15, { tag: 'answer' }); } }
    else if (a === 'home') { r.lights = r.lights.filter(l => l.tag !== 'home'); playLit(r, [1], now() + 0.05, { tag: 'home' }); }
    else if (a === 'reveal') { if (stage === 'answer' && !r.deadline) reveal(); }                    // manual mode only
    else if (a === 'hint') { hinted = true; if (stage !== 'shown') { r.lights = []; playLit(r, [1], now() + 0.05, { tag: 'home' }); } }   // home + the choices, never the answer
    else if (a === 'heard') heard = !heard;
    else if (a === 'found') found = !found;
    else if (a === 'right' || a === 'miss' || a === 'next') {
      if (stage !== 'shown') { if (a === 'next') return; reveal(); }
      if (a === 'right') heard = true;
      record(); i++;
      if (i >= queue.length) return 'next';
      trial(false);
    }
  };
  return r;
}

/* 3–4 · Listen → sing → play, one phrase at a time (shared with the course).
   Stages run one after another; each starts its audio when it begins, so Hear again / manual reveal fit in naturally:
     home (per setting) → [imagine → sing] → call → sing → play → [replay + reveal if the phrase was hidden] → check.
   ex.response: 'pref' = one "sing it, then play it" window of the chosen length (or until you press Reveal in Manual).
   Phrases: ex.phrases (fixed), ex.melody, ex.random (adaptive); items can carry chord, dyn, artic, swing, start. */
function PhraseRunner(ex) {
  const r = { ui: {}, lights: [] }, reps = scaleN(ex.repetitions || 1), rnd = ex.random ? Object.assign({}, ex.random) : null, imagine = ex.mode === 'imagine';
  const items = [];
  if (rnd) { for (let k = 0; k < scaleN(rnd.count || 8); k++) items.push(null); }
  else { const src = ex.melody ? [melody(ex.melody)] : (ex.phrases || [ex.phrase || [1]]).map(asItem); src.forEach(x => { for (let k = 0; k < reps; k++) items.push(x); }); }
  let it = 0, len = rnd ? (rnd.length || 3) : 0, streak = 0, tries = 0;
  const minL = rnd ? (rnd.min_length || Math.max(1, len - 1)) : 0, maxL = rnd ? (rnd.max_length || len + 1) : 0;
  const itemAt = () => items[it] || (items[it] = genPhrase(rnd, len));
  const homeMode = () => ex.home || pref('homeRef');
  // is this phrase hidden while you listen? (exercise asks for it, fading hints say so, or you chose the Hidden display)
  const hiddenNow = () => !imagine && (ex.hide_answer || (ex.fade_hints && it / Math.max(1, items.length) >= 2 / 3) || (pref('display') === 'hidden' && !ex.guided));
  function build() {
    const spb = 60 / tempo(), item = r.item, beats = item.durs.reduce((a, b) => a + b, 0) + (item.start || 0), callLen = beats * spb + 0.4;
    const w = pref('wait'), single = ex.response === 'pref';
    const resp = single ? (typeof w === 'number' ? w : Infinity) : (ex.response_seconds || Math.max(4, beats * spb + 2));
    const cc = item.chord || ex.context_chord, st = [];
    const wantHome = cc || ex.home === 'always' || homeMode() === 'every' || (homeMode() === 'exercise' && it === 0 && tries === 0);
    if (wantHome) st.push({ name: 'home', len: cc ? spb * 2 + 0.3 : 2 * spb, go: t => { if (cc) strum(cc, t, spb * 2); else { r.lights.push({ t, e: t + spb * 0.9, d: 1, tag: 'home' }); pluck(degMidi(1), t, spb * 0.9, 0.3); } } });
    if (imagine) { st.push({ name: 'imagine', len: ex.imagine_seconds || Math.max(5, item.degs.length * 1.6) }); st.push({ name: 'sing', len: single ? resp : resp }); }
    const callGo = tag => t => { r.callAt = t; playItem(item, t, spb); let off = item.start || 0; item.degs.forEach((d, i) => { const b = item.durs[i] || 1; if (d !== 'r') r.lights.push({ t: t + off * spb, e: t + (off + b * 0.92) * spb, d, tag }); off += b; }); };
    st.push({ name: 'call', len: callLen, go: callGo('target') });
    if (single && !imagine) st.push({ name: 'respond', len: resp });
    else { if (!imagine && !ex.no_sing) st.push({ name: 'sing', len: resp }); st.push({ name: 'play', len: resp }); }
    r.hid = hiddenNow();
    if (r.hid || ex.replay) st.push({ name: 'replay', len: callLen, go: callGo('answer') });   // reveal + replay to compare
    st.push({ name: 'check', len: Infinity });
    r.st = st; r.spb = spb;
  }
  function startItem() { newBus(); r.lights = []; r.item = itemAt(); build(); r.si = -1; r.stEnd = now() + 0.15; r.t0 = r.stEnd; }
  function advance(t) {            // move through stages; each one starts its audio when it begins
    while (r.si < r.st.length - 1 && t >= r.stEnd) {
      r.si++; const s = r.st[r.si], at = Math.max(t, r.stEnd);
      r.stStart = at; r.stEnd = at + s.len; if (s.go) s.go(at);
    }
  }
  r.jump = name => { const k = r.st.findIndex(s => s.name === name); if (k < 0) return; r.si = k - 1; r.stEnd = now(); advance(now()); };   // tests & manual reveal
  r.begin = () => { backingStop(); if (ex.drone) droneOn(ex.drone_level || 0.1); else droneOff(); it = 0; startItem(); };
  r.update = t => {
    advance(t);
    const inst = instFor(ex, 0, 1), s = r.st[Math.max(0, r.si)], stage = r.si < 0 ? 'home' : s.name;
    let active = -1;
    if ((stage === 'call' || stage === 'replay') && r.callAt != null) { let off = (t - r.callAt) / r.spb - (r.item.start || 0); if (off >= 0) for (let i = 0; i < r.item.durs.length; i++) { if (off < r.item.durs[i]) { active = i; break; } off -= r.item.durs[i]; } }
    const T = {
      home: ['LISTEN', r.item.chord || ex.context_chord ? 'The chord…' : 'Home…'],
      imagine: ['IMAGINE', "Read it. Hear it in your head. Don't sing yet."],
      sing: ['SING', ex.sing_text || (imagine ? 'Sing what you imagined.' : 'Sing it back.')],
      call: ['LISTEN', ex.listen_text || (imagine ? 'Now listen. Did it match?' : 'Listen…')],
      respond: ['SING', fill(ex.respond_text || 'Sing it, then play it on {inst}.', inst)],
      play: ['PLAY', playText(ex, inst)],
      replay: ['LISTEN', 'Here it is again — compare.'],
      check: ['CHECK', ex.check_text || (imagine ? 'Did your imagined version match?' : 'How did that go?')],
    }[stage];
    const shown = stage === 'replay' || stage === 'check', n = r.item.degs.length;
    let mask = null;
    if (!shown && !imagine) {
      if (r.hid) mask = Array(n).fill(true);
      else if (ex.fade_hints && it / Math.max(1, items.length) >= 1 / 3) mask = r.item.degs.map((_, i) => i > 0);
    }
    const waiting = stage === 'respond' || stage === 'sing' || stage === 'play';
    let ctx = null;
    if (stage === 'check') ctx = [['got', imagine ? '✓ It matched' : '✓ Got it'], ['again', '↻ Again']];
    else if (waiting && (r.hid || stage === 'respond')) { ctx = [['hear', '↻ Hear again']]; if (homeMode() !== 'every') ctx.push(['home', '🏠 Home']); if (s.len === Infinity) ctx.push(['reveal', '👁 Reveal']); }
    const useLand = ex.land !== false && !(r.item.chord || ex.context_chord) && landFits(r.item.degs);
    r.ui = { phase: T[0], inst, text: T[1], degs: r.item.degs, active, mask, lock: !!r.hid, revealed: shown,
      land: useLand ? landUI(r, t, { pool: ex.pool, hideTarget: !!r.hid && !shown, reveal: stage === 'check' && r.hid ? r.item.degs : [] }) : null,
      showSeq: true, chordRow: (r.item.chord || ex.context_chord) ? [{ sym: r.item.chord || ex.context_chord }] : null,
      remain: s && isFinite(s.len) && r.stEnd ? Math.max(0, r.stEnd - t) : null, total: s && isFinite(s.len) ? s.len : null, ctx, item: `${it + 1} of ${items.length}` };
    return false;
  };
  r.action = a => {
    if (a === 'got') {
      if (rnd) { streak = tries === 0 ? streak + 1 : 0; if (streak >= 3 && len < maxL) { len++; streak = 0; } }
      it++; tries = 0; if (it >= items.length) return 'next'; startItem();
    } else if (a === 'again' || a === 'repeat') {
      if (a === 'again') tries++;
      if (rnd && tries >= 2 && len > minL) { len--; streak = 0; tries = 0; items[it] = null; }   // struggling: a shorter phrase
      startItem();
    } else if (a === 'hear') { const keep = tries; startItem(); tries = keep; }             // hearing it again is learning, not failing
    else if (a === 'home') { r.lights.push({ t: now() + 0.05, e: now() + 0.75, d: 1, tag: 'home' }); pluck(degMidi(1), now() + 0.05, 0.7, 0.4); }
    else if (a === 'reveal') { if (r.st[r.si] && r.st[r.si].len === Infinity && r.st[r.si].name !== 'check') { r.stEnd = now(); advance(now()); } }
    else if (a === 'hint') { S.tempoMul = Math.max(0.5, S.tempoMul * 0.85); startItem(); }
  };
  return r;
}

/* 5 · Musical conversation: the glasses ask a short question from the stage's notes; you invent an answer.
   Home is replayed between attempts (per the Home setting). Nothing is marked — it's free creation. */
function ConversationRunner(ex) {
  const r = { ui: {}, lights: [] }, dur = scaleSec(ex.duration_seconds || 300), pool = ex.pool || [1, 3, 5];
  let q = [1, 3, 5], nextAt = 0, answerAt = 0, n = 0;
  const homeMode = () => ex.home || pref('homeRef');
  function ask(t) {
    r.lights = []; n++;
    q = ex.questions && n <= ex.questions.length ? ex.questions[n - 1] : genPhrase({ degrees: pool, max_leap: 3 }, 3 + Math.floor(Math.random() * 2));
    let tt = t + 0.1;
    if (homeMode() === 'every' || (homeMode() === 'exercise' && n === 1)) tt = playLit(r, [1], tt, { tag: 'home' }) + 0.5;
    answerAt = playLit(r, q, tt, { tag: 'q' }) + 0.2;
    nextAt = answerAt + (ex.answer_seconds || 10);
  }
  r.begin = () => { newBus(); backingStop(); if (ex.drone !== false) droneOn(0.1); else droneOff(); r.t0 = now(); n = 0; ask(r.t0); };
  r.update = t => {
    const el = t - r.t0;
    if (t >= nextAt) { if (el >= dur) return true; ask(t); }
    const answering = t >= answerAt, inst = instFor(ex, 0, 1);
    r.ui = { phase: answering ? 'CREATE' : 'LISTEN', inst,
      text: answering ? `Your answer — use ${pool.map(degText).join(' ')}. Rhythm, silence… end on 1.` : 'The question…',
      degs: q, revealed: true, land: landFits(pool) ? landUI(r, t, { pool }) : null, showSeq: !answering,
      remain: answering ? Math.max(0, nextAt - t) : null, total: ex.answer_seconds || 10,
      ctx: answering && homeMode() !== 'every' ? [['home', '🏠 Home'], ['more', '⏭ New question']] : answering ? [['more', '⏭ New question']] : null, item: `Question ${n}` };
    return false;
  };
  r.action = a => {
    if (a === 'more' || a === 'repeat') ask(now());
    if (a === 'home') playLit(r, [1], now() + 0.05, { tag: 'home' });
  };
  return r;
}

/* 6 · Reflect: how it felt, then a separate choice of what to do next. */
function ReflectRunner() {
  const r = { ui: {} }; let feel = null;
  r.begin = () => { newBus(); droneOff(); backingStop(); feel = null; };
  r.update = () => {
    const practice = !!L.lesson.practice, nx = practice ? null : nextLessonOf(L.lesson);
    if (!feel) r.ui = { phase: 'REFLECT', text: 'How did that feel?', ctx: [['easy', 'Easy'], ['ok', 'Just right'], ['practice', 'Needs practice']] };
    else r.ui = { phase: 'REFLECT', text: feel === 'practice' ? 'Practice is how ears grow. What next?' : 'Lovely. What next?',
      ctx: [['continue', practice ? (L.lesson.stage < 5 ? 'Continue ▶' : 'Finish ▶') : nx ? `Continue ▶` : 'Finish ▶'], ['rep_ex', '↻ Repeat exercise'], ['rep_lesson', '⟲ Repeat lesson']] };
    r.ui.degs = null; return false;
  };
  r.action = a => {
    if (['easy', 'ok', 'practice'].includes(a)) { feel = a; return; }
    if (a === 'rep_ex') { let k = L.i - 1; while (k > 0 && L.exs[k].type === 'reflection') k--; return { jump: Math.max(0, k), feel }; }
    if (a === 'continue' || a === 'rep_lesson') return { finish: true, feel, next: a };
  };
  return r;
}

/* ======================================================================
   🎹 Landscape Practice — a permanent playground beside the 60-day course.
   Five stages (window.PRACTICE in lessons.js). A stage unlocks when you choose Continue at the end of the one before
   (your choice, never an accuracy score); any unlocked stage can be revisited at any time.
   ====================================================================== */
const LP = () => (P.lp = Object.assign({ unlocked: 1, stage: 1 }, P.lp || {}));
function practiceLesson(stage) {
  const pr = window.PRACTICE || { stages: [], build: () => [] }, st = pr.stages.find(s => s.stage === stage) || pr.stages[0];
  return { lesson_id: 'LP' + st.stage, practice: true, stage: st.stage, week: 0, day: 0, title: `Landscape · Stage ${st.stage}`,
    objective: st.goal, concert_key: 'C', scale: 'major', tempo_bpm: 65, duration_minutes: 30, exercises: pr.build(st) };
}
function renderLP() {
  const lp = LP(), pr = window.PRACTICE || { stages: [] };
  $('lpStart').textContent = `▶ Start Stage ${lp.stage}`;
  $('lpDisplay').textContent = `👁 ${DISPLAY_LABEL[pref('display')]}`;
  $('lpHome').textContent = `🏠 ${HOME_LABEL[pref('homeRef')]}`;
  $('lpWait').textContent = `⏱ ${waitLabel(pref('wait'))}`;
  $('lpDrone').textContent = `〰 Drone ${pref('drone') ? 'on' : 'off'}`;
  $('lpInst').textContent = P.instrument === 'sax' ? '🎷 Sax' : P.instrument === 'both' ? '🎸+🎷 Both' : '🎸 Guitar';
  $('lpMin').textContent = `⏱ ${P.minutes} min`;
  $('lpList').innerHTML = pr.stages.map(s => {
    const open = s.stage <= lp.unlocked;
    return `<button data-st="${s.stage}" class="${s.stage === lp.stage ? 'sel' : ''}${open ? '' : ' locked'}">${open ? '' : '🔒 '}Stage ${s.stage} · ${esc(s.title)}<small>${open ? esc(s.goal) : `Opens when you choose Continue after Stage ${s.stage - 1}`}</small></button>`;
  }).join('') + `<div class="stats">These settings also apply to the 60-day course.</div>`;
  $('lpList').querySelectorAll('button').forEach(b => b.onclick = () => {
    const st = +b.dataset.st; if (st > LP().unlocked) return;
    LP().stage = st; saveP(); startLesson('LP' + st, true);
  });
}
function openLP() { renderLP(); go('lp', 'lpStart'); }

// --- tunes (public-domain melodies live in lessons.js as window.TUNES) ---
const tuneData = name => (window.TUNES || {})[name];
// A tune phrase's chords: 'I' = one 4-beat bar, ['V','I'] = that bar split in half
const tuneChords = ph => ph.chords.flatMap(c => Array.isArray(c) ? c.map(x => ({ sym: x, beats: 4 / c.length })) : [{ sym: c, beats: 4 }]);

/* Play-along with a band, phrase by phrase (order 'phrase': listen, then you play the same 4 bars),
   whole tune (order 'whole': hear it all, then play it all), 'listen' only, or 'play' (band only — "minus one").
   reveal: 'show' (default) | 'hide' (notes hidden until you press 👁 Show or ask for a hint). */
function TuneRunner(ex) {
  const r = { ui: {} }, tune = tuneData(ex.tune), ph = tune.phrases, order = ex.order || 'phrase';
  const segs = order === 'phrase' ? ph.flatMap((p, k) => [{ k, call: true }, { k, call: false }])
    : order === 'whole' ? [...ph.map((p, k) => ({ k, call: true })), ...ph.map((p, k) => ({ k, call: false }))]
    : ph.map((p, k) => ({ k, call: order === 'listen' }));
  if (ex.repeat > 1) { const one = segs.slice(); for (let n = 1; n < ex.repeat; n++) segs.push(...one); }
  r.begin = () => {
    newBus(); droneOff(); r.spb = 60 / tempo(); r.segLen = 16 * r.spb;
    backingStart(tempo(), { progression: segs.flatMap(s => tuneChords(ph[s.k])), style: ex.style || tune.style || 'pop' });
    r.t0 = A.backing.start; r.dur = segs.length * r.segLen; r.sched = -1;
  };
  r.update = t => {
    const el = t - r.t0, inst = instFor(ex, 0, 1);
    if (el >= r.dur) return true;
    if (r.sched + 1 < segs.length && t >= r.t0 + (r.sched + 1) * r.segLen - 0.5) { r.sched++; const s = segs[r.sched]; if (s.call) playItem(asItem(ph[s.k]), r.t0 + r.sched * r.segLen, r.spb, 0.55); }
    const i = Math.max(0, Math.floor(el / r.segLen)), s = segs[Math.min(i, segs.length - 1)], item = ph[s.k];
    let active = -1, phase = s.call ? 'LISTEN' : 'PLAY', text;
    if (el < 0) { phase = 'LISTEN'; text = `${tune.title} — the band counts you in…`; }
    else if (s.call) {
      text = `Listen — ${tune.title}, phrase ${s.k + 1}.`;
      let off = (el - i * r.segLen) / r.spb - (item.start || 0);
      for (let j = 0; j < item.durs.length && off >= 0; j++) { if (off < item.durs[j]) { active = j; break; } off -= item.durs[j]; }
    } else text = order === 'play' ? `Play ${tune.title} with the band — phrase ${s.k + 1}.` : `Your turn — play phrase ${s.k + 1} with the band.`;
    r.ui = { phase, inst, text, degs: item.degs, active, hidden: ex.reveal === 'hide', chord: chordUI(ex, t, Math.max(0, el) / r.dur),
      beat: backingBeat(t), remain: r.dur - Math.max(0, el), total: r.dur, item: `Phrase ${s.k + 1} of ${ph.length}` };
    return false;
  };
  r.action = a => { if (a === 'repeat') r.begin(); if (a === 'hint') S.reveal = true; };
  return r;
}

// --- your song (Week 12): stored in P.song, chosen step by step ---
const DEFAULT_SONG = { key: 'C', prog: ['I', 'V', 'vi', 'IV'], style: 'pop', b: ['IV', 'V', 'iii', 'vi'], minor: false, custom: false };
const song = () => Object.assign({}, DEFAULT_SONG, P.song || {});
const PROG_PRESETS = [
  { id: 'pop', label: 'I–V–vi–IV', prog: ['I', 'V', 'vi', 'IV'] },

// --- guide-tone line: 3rd or 7th of each chord, whichever is nearest the last one (smooth jazz voice leading) ---

/* arrow keys: nearest button in that direction (same as the other glasses apps) */
document.addEventListener('keydown', e => {
  if (screen === 'guide' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); flipGuide(e.key === 'ArrowRight' ? 1 : -1); return; }   // swipe = flip card
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!dir) return;
  const scr = document.querySelector('.screen.active');
  const els = scr ? [...scr.querySelectorAll('button')].filter(b => !b.disabled && b.offsetParent !== null) : [];
  if (!els.length) return;
  e.preventDefault();
  const curEl = els.includes(document.activeElement) ? document.activeElement : null;
  if (!curEl) { els[0].focus(); return; }
  const r = curEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cand = els.filter(b => b !== curEl).map(b => {
    const q = b.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
    const along = dx * dir[0] + dy * dir[1], perp = Math.abs(dx * dir[1] + dy * dir[0]);
    return { b, along, perp, score: along + 4 * perp };
  }).filter(c => c.along > 1);
  const pool = cand.some(c => c.perp <= c.along) ? cand.filter(c => c.perp <= c.along) : cand;
  pool.sort((a, b) => a.score - b.score);
  if (pool[0]) { pool[0].b.focus(); pool[0].b.scrollIntoView({ block: 'nearest' }); }
});

    { name: 'stop_backing_track', description: 'Musical Intuition: stop the drone or backing track.', inputSchema: none, execute: async () => { droneOff(); backingStop(); return reply('Stopped.'); } },
    { name: 'next_exercise', description: 'Musical Intuition: skip to the next exercise.', inputSchema: none, execute: async () => { if (!inLesson()) return reply('No lesson is running.'); nextEx(); return reply(status()); } },
    { name: 'pause_lesson', description: 'Musical Intuition: pause the lesson.', inputSchema: none, execute: async () => { togglePause(true); return reply('Paused.'); } },
    { name: 'resume_lesson', description: 'Musical Intuition: resume the lesson.', inputSchema: none, execute: async () => { if (!L) return reply('No lesson to resume.'); show('lesson', 'bNext'); togglePause(false); return reply('Resumed.'); } },
    { name: 'finish_lesson', description: "Musical Intuition: finish today's lesson now and save it.", inputSchema: none, execute: async () => { if (!inLesson()) return reply('No lesson is running.'); finishLesson({}); return reply('Saved. Nice practice.'); } },
    { name: 'lesson_status', description: 'Musical Intuition: say where I am in the lesson and what to do.', inputSchema: none, execute: async () => reply(status()) },
    { name: 'save_reflection', description: 'Musical Intuition: save a spoken note about how practice went.', inputSchema: { type: 'object', properties: { note: { type: 'string' } }, required: ['note'] },
      execute: async ({ note }) => { P.reflections.push({ date: todayISO(), id: L ? L.lesson.lesson_id : P.current, note: String(note).slice(0, 500) }); saveP(); return reply('Saved your note.'); } },
    { name: 'show_guide', description: 'Musical Intuition: open the quick reference guide. Optional topic: landscape (C major notes), gravity (resolutions), chords (seven chords), harmony (I–IV–V–I, I–V–vi–IV), minor, blues, twelve_bar, jazz (ii–V–I), practice.', inputSchema: { type: 'object', properties: { topic: { type: 'string', enum: GUIDE_TOPICS } } },
      execute: async ({ topic } = {}) => { const i = GUIDE_TOPICS.indexOf(topic); openGuide(i >= 0 ? i : null); const g = buildGuide()[guideAt]; return reply(`${g.title}. ${g.tip}`); } },
    { name: 'open_landscape_practice', description: 'Musical Intuition: open Landscape Practice, optionally starting a stage (1–5).', inputSchema: { type: 'object', properties: { stage: { type: 'number' } } },
      execute: async ({ stage } = {}) => { if (stage && stage <= LP().unlocked) { LP().stage = stage; saveP(); startLesson('LP' + stage); return reply(`Stage ${stage}.`); } openLP(); return reply(`Landscape Practice. Stage ${LP().stage} is next; stages 1 to ${LP().unlocked} are open.`); } },
    { name: 'set_display_level', description: 'Musical Intuition: display level — full (numbers and note names), numbers (numbers only) or hidden (audio only until the reveal).', inputSchema: { type: 'object', properties: { level: { type: 'string', enum: ['full', 'numbers', 'hidden'] } }, required: ['level'] },
      execute: async ({ level }) => { setPref('display', level); if ($('lp').classList.contains('active')) renderLP(); render(); return reply(`Display: ${DISPLAY_LABEL[level]}.`); } },
    { name: 'set_home_reference', description: 'Musical Intuition: when to hear home — every (before every attempt), exercise (once per exercise) or request (only when I ask).', inputSchema: { type: 'object', properties: { mode: { type: 'string', enum: ['every', 'exercise', 'request'] } }, required: ['mode'] },
      execute: async ({ mode }) => { setPref('homeRef', mode); if ($('lp').classList.contains('active')) renderLP(); return reply(`Home: ${HOME_LABEL[mode]}.`); } },
    { name: 'set_response_window', description: 'Musical Intuition: seconds to respond before the answer is revealed: 6, 8, 12, 20, or manual.', inputSchema: { type: 'object', properties: { seconds: { type: 'string', enum: ['6', '8', '12', '20', 'manual'] } }, required: ['seconds'] },
      execute: async ({ seconds }) => { setPref('wait', seconds === 'manual' ? 'manual' : +seconds); if ($('lp').classList.contains('active')) renderLP(); return reply(`Response window: ${waitLabel(pref('wait'))}.`); } },
    { name: 'set_drone', description: 'Musical Intuition: turn the quiet home drone on or off.', inputSchema: { type: 'object', properties: { on: { type: 'boolean' } }, required: ['on'] },
      execute: async ({ on }) => { setPref('drone', !!on); if (!on) droneOff(); if ($('lp').classList.contains('active')) renderLP(); return reply(`Drone ${on ? 'on' : 'off'}.`); } },
    { name: 'hear_again', description: 'Musical Intuition: hear the note or phrase again (restarts the response timer).', inputSchema: none, execute: async () => { doAction('hear'); return reply('Again.'); } },
    { name: 'play_home', description: 'Musical Intuition: play home (the tonic).', inputSchema: none, execute: async () => { if (inLesson()) doAction('home'); else { audio(); pluck(degMidi(1), now() + 0.05, 1.2, 0.5); } return reply('Home.'); } },
    { name: 'reveal_answer', description: 'Musical Intuition: reveal the answer (only in Manual reveal mode, after you have responded).', inputSchema: none,
      execute: async () => { if (pref('wait') !== 'manual') return reply('The answer reveals itself when the timer ends.'); doAction('reveal'); return reply('Revealed.'); } },
    { name: 'record_my_playing', description: 'Musical Intuition: record my playing.', inputSchema: none,
      execute: async () => reply("Glasses web apps can't use the microphone yet, so I can't record. Your phone's voice recorder works for now.") },
  ];
  for (const t of tools) { try { mc.registerTool(t); } catch (e) {} }
})();

/* offline: cache the app after the first visit */
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

history.replaceState({ screen: 'home', depth: 0 }, '');
renderHome();
setTimeout(() => $('bStart').focus(), 0);
</script>
</body>
</html>
